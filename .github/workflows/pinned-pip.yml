name: Verify pinned pip on Ubuntu

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        certificates: [default, legacy-certs]
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Print system certificate package version
        run: dpkg-query -W ca-certificates
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          pip-version: '26.2.2'
      - name: Verify pip version
        run: |
          python --version
          python -m pip --version
          python -c 'import pip; assert pip.__version__ == "26.2.2", pip.__version__'
      - name: Verify pip rejects compromised certificate chains
        continue-on-error: ${{ matrix.certificates == 'default' }}
        shell: bash
        env:
          CERTIFICATES: ${{ matrix.certificates }}
        run: |
          options=()
          if [ "$CERTIFICATES" = legacy-certs ]; then
            options+=(--use-deprecated=legacy-certs)
          fi
          failed=0
          for host in dv-g3b-noct-emudhra.we-have-a-problem.com dv-g3b-aaa-noct-emudhra.we-have-a-problem.com; do
            if python -m pip index versions pip "${options[@]}" --index-url "https://$host/" --retries 0 --timeout 20 > probe.log 2>&1; then
              cat probe.log
              echo "Unexpected success for $host"
              exit 1
            fi
            cat probe.log
            if grep -q 'CERTIFICATE_VERIFY_FAILED' probe.log; then
              echo "Confirmed certificate rejection for $host"
            else
              echo "Certificate rejection NOT confirmed for $host"
              failed=1
            fi
          done
          exit "$failed"
